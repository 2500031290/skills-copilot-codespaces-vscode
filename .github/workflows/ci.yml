name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test Python
        run: python -m unittest discover -s python -p 'test_*.py'
      - name: Compile Java
        run: javac -d "$RUNNER_TEMP/copilot-java" java/src/Main.java
      - name: Check JavaScript
        run: node --check javascript/hello-copilot/index.js
